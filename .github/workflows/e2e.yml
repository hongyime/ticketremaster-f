name: E2E Tests (Playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'tests/**', 'scripts/e2e-server.mjs', 'playwright.config.ts', 'vite.config.ts', 'package*.json', 'tsconfig*.json', '.github/workflows/e2e.yml']
  schedule:
    - cron: '0 2 * * 1' # Weekly Monday 10am SGT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check browser test types
        run: npm run test:types
      - name: Build production application
        run: npm run build
      - name: Validate frontend flows with isolated providers
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
